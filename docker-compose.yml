# Usage (from twstock-radar/):
#   cp .env.example .env
#   docker compose up -d --build
#
# API:   http://localhost:8000
# Nginx: http://localhost:80  (optional profile)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
    volumes:
      - radar_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: ..
      dockerfile: twstock-radar/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://radar:radar@db:5432/radar
      TIMEZONE: Asia/Taipei
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

  worker:
    build:
      context: ..
      dockerfile: twstock-radar/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://radar:radar@db:5432/radar
      TIMEZONE: Asia/Taipei
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]

  nginx:
    profiles: ["edge"]
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro

volumes:
  radar_pg:
