[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twstock-radar"
version = "0.1.0"
description = "Taiwan market institutional scan, rules, and notifications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.0.0",
  "apscheduler>=3.10.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "twstock",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
twstock-radar = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
twstock = { path = "../twstock", editable = true }
